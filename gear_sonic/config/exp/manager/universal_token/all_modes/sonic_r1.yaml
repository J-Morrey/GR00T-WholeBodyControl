# @package _global_
# SONIC R1 config — 3 encoders (G1/motion tracking, teleop, SMPL) for Unitree R1.
# Based on sonic_h2 but targeting the R1 robot (27 bodies, 26 DOF).
#
# R1 names several bodies differently from the G1 the shared term YAMLs are
# written against, so every affected term is overridden below rather than by
# editing those YAMLs (which would break G1/H2):
#   pelvis -> pelvis_link, torso_link -> waist_yaw_link,
#   *_wrist_yaw_link -> *_wrist_roll_link, head_link -> head_yaw_link.
# R1 also has a single roll DOF per wrist instead of G1's roll/pitch/yaw.

defaults:
  - /algo: ppo_im_phc
  - /manager_env: base_env
  - /callbacks/read_eval
  - /callbacks/im_resample
  - /aux_losses: universal_token/g1_recon_and_all_latent
  - override /trainer: trl_ppo_aux
  - override /actor_critic: universal_token/all_mlp_v1
  - override /manager_env/observations/tokenizer: unitoken_all_noz
  - override /manager_env/observations/policy: local_dir_hist
  - override /manager_env/observations/critic: privileged_mf_hist
  - override /manager_env/events: tracking/level0_4
  - override /manager_env/terminations: tracking/base_adaptive_strict_ori_foot_xyz
  - override /manager_env/rewards: tracking/base_5point_local_feet_acc

use_manager_env: true

exp_base: ${hydra:runtime.choices.exp}
exp_var: test
experiment_name: ${exp_base}_${exp_var}
experiment_dir: ${base_dir}/${project_name}/${experiment_name}-${timestamp}

num_envs: 4096
project_name: TRL_R1_Track

actor_prop_history_length: 10
actor_actions_history_length: 10

critic_prop_history_length: 10
critic_actions_history_length: 10

manager_env:
  rewards:
    feet_acc:
      weight: -2.5e-6
    # G1 names: ["left_wrist_yaw_link", "right_wrist_yaw_link", "head_link"].
    # None of them exist on R1, and _get_body_indexes silently drops unknown
    # names -- an empty body list makes this reward NaN with no traceback.
    anti_shake_ang_vel:
      params:
        body_names: ["left_wrist_roll_link", "right_wrist_roll_link", "head_yaw_link"]
    undesired_contacts:
      params:
        sensor_cfg:
          body_names:
            - "^(?!left_ankle_roll_link$)(?!right_ankle_roll_link$)(?!left_wrist_roll_link$)(?!right_wrist_roll_link$)(?!left_elbow_link$)(?!right_elbow_link$).+$"
  terminations:
    ee_body_pos:
      params:
        body_names:
          - "left_ankle_roll_link"
          - "right_ankle_roll_link"
          - "left_wrist_roll_link"
          - "right_wrist_roll_link"
  events:
    # These two resolve regexes against the live articulation, so a name that
    # does not exist raises rather than being ignored.
    base_com:
      params:
        asset_cfg:
          body_names: "waist_yaw_link"
    randomize_rigid_body_mass:
      params:
        asset_cfg:
          body_names: ".*_wrist_roll_link|waist_yaw_link"
  observations:
    tokenizer:
      # IsaacLab DOF indices of left/right_wrist_roll_joint. G1 lists 6 wrist
      # DOFs here; R1 has 2, which just narrows the SMPL encoder input.
      joint_pos_multi_future_wrist_for_smpl:
        params:
          joints_idx: [24, 25]
  config:
    robot:
      type: r1
    terrain_type: trimesh
  commands:
    motion:
      anchor_body: "pelvis_link"
      # body_names[0] must be the root (motion_lib asserts body_indexes[0] == 0),
      # and reward_point_body / vr_3point_body must be subsets of it.
      body_names: [
        "pelvis_link",
        "left_hip_roll_link",
        "left_knee_link",
        "left_ankle_roll_link",
        "right_hip_roll_link",
        "right_knee_link",
        "right_ankle_roll_link",
        "waist_yaw_link",
        "left_shoulder_roll_link",
        "left_elbow_link",
        "left_wrist_roll_link",
        "right_shoulder_roll_link",
        "right_elbow_link",
        "right_wrist_roll_link",
      ]
      # Wrist offsets are the measured left/right_hand_link positions in the
      # wrist_roll frame (the frames the retargeter aimed at); the waist offset
      # puts the point at head height, as G1's torso_link + 0.35 does.
      vr_3point_body: ["left_wrist_roll_link", "right_wrist_roll_link", "waist_yaw_link"]
      vr_3point_body_offset: [[0.068, -0.0017, 0.0014], [0.068, 0.0017, 0.0014], [0.0, 0.0, 0.37]]
      reward_point_body: ["waist_yaw_link", "left_wrist_roll_link", "right_wrist_roll_link"]
      reward_point_body_offset: [[0.0, 0.0, 0.37], [0.068, -0.0017, 0.0014], [0.068, 0.0017, 0.0014]]
      num_future_frames: 10
      dt_future_ref_frames: 0.1
      smpl_num_future_frames: 10
      smpl_dt_future_ref_frames: 0.02
      cat_upper_body_poses: true
      cat_upper_body_poses_prob: 0.5

      freeze_frame_aug: true
      teleop_sample_prob_when_smpl: 0.5

      motion_lib_cfg:
        adaptive_sampling:
          adp_samp_failure_rate_max_over_mean: 200
        motion_file: null
        # wrist_mujoco_dof_indices in motion_lib_base is hardcoded to G1's, so
        # randomize_wrist_poses must stay off for R1.
        smpl_motion_file: dummy
        smpl_y_up: true
        asset:
          assetFileName: "r1.xml"

algo:
  config:
    empty_cache_every_n_ppo_epoch: -1
    num_steps_per_env: 24
    use_clampped_std: true
    std_clamp_min: 0.001
    std_clamp_max: 0.5
    max_grad_norm: 0.1
    actor:
      backbone:
        reencode_smpl_g1_recon: true
        encoders:
          g1:
            inputs: ["command_multi_future_nonflat", "motion_anchor_ori_b_mf_nonflat"]
          teleop:
            inputs:
              [
                "command_multi_future_lower_body",
                "vr_3point_local_target",
                "vr_3point_local_orn_target",
                "motion_anchor_ori_b",
              ]
          smpl:
            inputs:
              [
                "smpl_joints_multi_future_local_nonflat",
                "smpl_root_ori_b_multi_future",
                "joint_pos_multi_future_wrist_for_smpl",
              ]
        decoders:
          g1_kin:
            outputs: ["command_multi_future_nonflat", "motion_anchor_ori_b_mf_nonflat"]

    critic:
      backbone:
        module_config_dict:
          layer_config:
            hidden_dims: [2048, 2048, 1024, 1024, 512, 512]
