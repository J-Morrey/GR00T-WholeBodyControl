# @package _global_
# Small (~1.2M parameter) R1 policy trained FROM SCRATCH.
#
# Sanity check on the R1 robot model and the surrounding pipeline: if a small
# network learns a stable, rising tracking curve from random init, then the URDF,
# actuators, motion data, rewards and terminations are sound, and any trouble in
# the Any2Any fine-tuning lies in the transfer machinery rather than underneath it.
#
# Deliberately identical to sonic_r1.yaml except for network width -- same
# observations, rewards, terminations, events, motion data and PPO settings -- so
# the only variables are scale and starting from random weights. SONIC itself
# scales this architecture from 1.2M to 42M parameters, so the small end is a
# supported configuration rather than an invention.

defaults:
  - manager/universal_token/all_modes/sonic_r1
  - _self_

project_name: TRL_R1_Small_Scratch

algo:
  config:
    actor:
      backbone:
        encoders:
          g1:
            params:
              module_config_dict:
                layer_config:
                  hidden_dims: [192, 128]
          teleop:
            params:
              module_config_dict:
                layer_config:
                  hidden_dims: [192, 128]
          smpl:
            params:
              module_config_dict:
                layer_config:
                  hidden_dims: [192, 128]
        decoders:
          g1_dyn:
            params:
              module_config_dict:
                layer_config:
                  hidden_dims: [192, 192, 128]
          g1_kin:
            params:
              module_config_dict:
                layer_config:
                  hidden_dims: [192, 128]
    critic:
      backbone:
        module_config_dict:
          layer_config:
            hidden_dims: [192, 192, 128]
