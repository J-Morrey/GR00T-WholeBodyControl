# @package _global_
# Motions the R1 provably cannot perform, removed from the training corpus.
#
# Composed on top of an exp config rather than inheriting from one:
#   +exp=manager/universal_token/all_modes/sonic_r1_any2any +motion_filter=r1_impossible
# A `defaults:` entry in a config that is itself reached through `defaults:`
# resolves relative to that file's own directory, not the group root, so an
# exp config inheriting from sonic_r1_any2any makes its `sonic_r1` default
# resolve to .../all_modes/manager/universal_token/all_modes/sonic_r1 and fail.
# This file has no defaults of its own, so it composes from anywhere.
#
# Selected from the adaptive-sampling counters in
# sonic_r1_any2any_full-20261116_232613/model_step_026000.pt (26,000 iterations,
# 54.7M bin traversals over all 129,785 clips). The criterion is terminations per
# 50-frame bin traversal -- length-normalised, so a long clip that falls once is
# not penalised the way a short clip that always falls is. Everything listed runs
# at >= 0.25, i.e. the policy falls at least once per 4 seconds of the clip, with
# the worst at 1.29 (it dies within ~40 frames of entering any segment of it).
#
# Removed: 173 clips, 0.13% of the corpus, 0.23% of traversals -- but 4.1% of all
# terminations. Removal is by prefix for whole families and by exact key for the
# rest; load_data matches `remove_motion_keys` with str.startswith, and a key is a
# prefix of itself. That also catches 10 `_M` mirrored siblings of named clips
# (e.g. ab_bicycle_002__A360 also removes ..._M), which is intended -- a mirrored
# copy of an impossible motion is equally impossible -- but it is why the count
# is 173 against the 163 clips the measurement named. Verified against the real
# corpus: 129,785 -> 129,612, no entry matching nothing.
#
# DELIBERATELY KEPT, although they also exceed 0.25: run_loop_180_R,
# jog_high_knees_R_loop, jog_ff_loop_180_R_very_fast, jog_arc_cw_loop_R_very_fast,
# avoid_obstacle_jump_run_ff_180_R. Locomotion is the skill we are training; these
# are hard, not impossible, and deleting them would remove the difficulty we want.
# Revisit them with reference-motion feasibility analysis (SIM2REAL_TODO.md 3.3)
# rather than by deletion.
#
# NOTE: removing clips changes the corpus size, so the bin count changes and
# motion_lib.load_state_dict drops the adaptive-sampling history on resume
# (motion_lib_base.py:2455). The curriculum restarts from a uniform prior; the
# policy, optimizer and step count resume normally.


manager_env:
  commands:
    motion:
      motion_lib_cfg:
        remove_motion_keys:
          # whole families (every clip whose key starts with these)
          - "fall_spin_in_air"
          - "flying_superman"
          - "flying_wings"
          - "jump_off_50cm"
          - "jump_off_front_50cm"
          - "jump_on_50cm"
          - "mayahi"
          - "swimming_breaststroke"
          - "swimming_freestyle"
          - "toe_touchers"
          # individual clips from otherwise-usable families
          # ab_bicycle
          - "ab_bicycle_002__A360"
          - "ab_bicycle_003__A360_M"
          # count_it
